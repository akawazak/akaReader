name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: manga-nexus
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Download Suwayomi JAR (for bundled server)
        shell: bash
        run: |
          curl -sL "https://api.github.com/repos/Suwayomi/Suwayomi-Server/releases/latest" \
            -H "Accept: application/vnd.github.v3+json" \
            -o release.json
          ASSET_URL=$(grep -o '"browser_download_url": "[^"]*Suwayomi-Server-v[^"]*\.jar"' release.json | head -1 | grep -o 'https://[^"]*')
          echo "Downloading: $ASSET_URL"
          curl -sL "$ASSET_URL" -o backend/Suwayomi-Server.jar
          rm release.json

      - name: Validate renderer
        working-directory: manga-nexus
        run: npm run validate

      # No Java, no JAR download needed anymore

      - name: Package (Windows)
        working-directory: manga-nexus
        shell: bash
        run: npm run dist -- --win --publish=never
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            manga-nexus/dist-electron/*.exe
            manga-nexus/dist-electron/*.exe.blockmap
            manga-nexus/dist-electron/*.zip
            manga-nexus/dist-electron/*.zip.blockmap
            manga-nexus/dist-electron/*.yml
          if-no-files-found: ignore

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    # Linux packaging pulls in some system libs on the runner; this is the
    # same command developers run locally with `npm run dist:linux`.

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: manga-nexus
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Download Suwayomi JAR (Linux)
        # The standalone server JAR is the only Linux asset akaReader can
        # actually use. linux-assets.tar.gz from this repo is intended for
        # the .deb/.rpm install path and only contains the GUI launcher
        # plus system-service scripts — running it from akaReader's
        # embedded layout crashes with "Could not find Suwayomi-Server.jar
        # at ..." because the launcher expects the server at the .deb
        # install root (/usr/share/java/suwayomi-server/bin/...).
        shell: bash
        run: |
          curl -sL "https://api.github.com/repos/Suwayomi/Suwayomi-Server/releases/latest" \
            -H "Accept: application/vnd.github.v3+json" \
            -o release.json
          ASSET_URL=$(grep -o '"browser_download_url": "[^"]*Suwayomi-Server-v[^"]*\.jar"' release.json | head -1 | grep -o 'https://[^"]*')
          echo "Downloading: $ASSET_URL"
          curl -sL "$ASSET_URL" -o backend/Suwayomi-Server.jar
          rm release.json

      - name: Validate renderer
        working-directory: manga-nexus
        run: npm run validate

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools \
            fakeroot \
            rpm

      - name: Package (Linux)
        working-directory: manga-nexus
        run: npm run dist:linux -- --publish=never
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
          # electron-builder's AppImage stage uses Docker by default; force
          # the in-process build path so the GitHub-hosted runner doesn't
          # need Docker-in-Docker.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            manga-nexus/dist-electron/*.AppImage
            manga-nexus/dist-electron/*.AppImage.blockmap
            manga-nexus/dist-electron/*.deb
            manga-nexus/dist-electron/latest-linux.yml
          if-no-files-found: ignore

  release:
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-*/*
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
