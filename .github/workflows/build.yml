name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Sync version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          cd manga-nexus
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$CURRENT" ]; then
            npm version $TAG_VERSION --no-git-tag-version --allow-same-version
            cd ..
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add manga-nexus/package.json manga-nexus/package-lock.json
            git commit -m "chore: sync version to $TAG_VERSION [skip ci]" || true
            git push || true
          fi

      - name: Install frontend dependencies
        working-directory: manga-nexus
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      # No Java, no JAR download needed anymore

      - name: Package (Windows)
        working-directory: manga-nexus
        shell: bash
        run: npm run dist -- --win --publish=never
        env:
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            manga-nexus/dist-electron/*.exe
            manga-nexus/dist-electron/*.exe.blockmap
            manga-nexus/dist-electron/*.zip
            manga-nexus/dist-electron/*.zip.blockmap
            manga-nexus/dist-electron/*.yml
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-*/*
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
